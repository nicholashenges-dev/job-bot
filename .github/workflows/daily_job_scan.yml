name: Daily Job Scan

on:
  schedule:
    # Runs twice daily at 1:00 PM UTC (8:00 AM EST) and 11:30 PM UTC (6:30 PM EST)
    - cron: '0 13 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows you to trigger a manual run anytime from the Actions tab

jobs:
  scan-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write config.json from secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json

      - name: Run Job Bot scan
        run: python search.py
